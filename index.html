<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

</head>
<body>
<title>ProCv+</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Concept: calm, trustworthy "document desk": deep blue + teal on cool white, a touch of German gold for highlights; red survives only in the logo star. Hero = blue panel with three stacked document pages; sections follow the buying journey (proof -> samples -> reviews -> price -> form). */
:root{
  --bg:#f3f7fa; --surface:#ffffff; --fg:#13293d; --muted:#51677a; --line:#d6e2ea;
  --brand:#12456b; --brand-fg:#ffffff; --accent:#0c8577; --soft:#e2f0f3; --gold:#f2b84b;
  --wa:#1b9e50; --wa-fg:#ffffff; --star:#d9252b; --ink:#0f3350; --ink-fg:#f2f7fa; --ink-muted:#a9c1d2;
  --f-display:"Bricolage Grotesque","Cairo",system-ui,sans-serif; --f-body:"Manrope","Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1824; --surface:#122436; --fg:#eaf2f7; --muted:#9db3c4; --line:#223a4e;
  --brand:#2c7db0; --brand-fg:#ffffff; --accent:#45c4b3; --soft:#16303f; --gold:#f2b84b;
  --wa:#34c473; --wa-fg:#04210f; --star:#ef4147; --ink:#08121c; --ink-fg:#eaf2f7; --ink-muted:#9db3c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1824; --surface:#122436; --fg:#eaf2f7; --muted:#9db3c4; --line:#223a4e;
  --brand:#2c7db0; --brand-fg:#ffffff; --accent:#45c4b3; --soft:#16303f; --gold:#f2b84b;
  --wa:#34c473; --wa-fg:#04210f; --star:#ef4147; --ink:#08121c; --ink-fg:#eaf2f7; --ink-muted:#9db3c4; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
html[lang="ar"] body{font-family:"Cairo","Manrope",system-ui,sans-serif}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:"Cairo",sans-serif;font-weight:800;line-height:1.4;letter-spacing:0}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto}
.full{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.85em 1.4em;border-radius:12px;font-weight:700;text-decoration:none;border:2px solid transparent;font-size:1rem;cursor:pointer;font-family:inherit}
.btn svg{width:1.25em;height:1.25em;fill:currentColor;flex:none}
.btn-wa{background:var(--wa);color:var(--wa-fg)}
.btn-main{background:var(--brand);color:var(--brand-fg)}
.btn-line{border-color:var(--line);background:var(--surface);color:var(--fg)}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.pill:focus-visible,summary:focus-visible,details a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}

.mark{display:inline-flex;align-items:center;gap:6px;direction:ltr;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1}
.mark .p{font-size:1.45rem}
.mark .c{font-size:1.45rem;background:var(--brand);color:var(--brand-fg);padding:3px 8px;border-radius:6px}
.mark svg{width:22px;height:22px;stroke:var(--star);fill:none;stroke-width:4;align-self:flex-start;margin-left:-4px}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.acts{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:.45em .95em;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
.bar .btn{padding:.5em 1em;font-size:.92rem}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:60px 64px}
.kicker{display:inline-block;background:var(--soft);color:var(--accent);font-weight:800;font-size:.85rem;padding:5px 14px;border-radius:999px;margin-bottom:18px}
.hero h1{font-size:clamp(2.2rem,5.6vw,3.9rem);font-weight:800}
html[lang="ar"] .hero h1{font-size:clamp(2rem,5vw,3.4rem)}
.hero h1 em,.h2 em{font-style:normal;color:var(--accent)}
.lead{font-size:1.1rem;color:var(--muted);margin-top:18px;max-width:54ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.ticks{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-weight:700;font-size:.95rem}
.ticks li::before{content:"\2713";color:var(--accent);font-weight:800;margin-inline-end:8px}

.visual{position:relative;max-width:480px;width:100%;margin-inline:auto;direction:ltr}
.panel{background:linear-gradient(160deg,var(--brand),#0b2f4a);border-radius:20px;aspect-ratio:1/1;position:relative;overflow:hidden}
.sheet{position:absolute;background:#fff;color:#13293d;box-shadow:0 18px 40px rgba(0,0,0,.28);border-radius:4px;overflow:hidden}
.sheet::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--gold)}
.s1{left:6%;top:12%;width:46%;height:70%;transform:rotate(-4deg)}
.s2{right:5%;top:8%;width:44%;height:70%;transform:rotate(3deg)}
.s3{left:27%;top:22%;width:46%;height:72%;z-index:2;text-align:center;padding:14px 12px}
.sheet h4{margin:0;font:800 10px "Bricolage Grotesque",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#12456b}
.ln{height:5px;border-radius:3px;background:#d9e3ea;margin:7px 0}
.pad{padding:14px}
.s1 .side{position:absolute;inset:0 auto 0 0;width:34%;background:#12456b}
.s1 .side .ln{background:#3d6c8e;margin:9px}
.s1 .ph{position:absolute;left:6%;top:6%;width:22%;aspect-ratio:1;border-radius:50%;background:#b9cbd8;border:3px solid #fff}
.s1 .col{position:absolute;left:40%;right:8%;top:10%}
.s3 .big{font:800 22px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.01em}
.s3 .sub{font:600 8px "Courier New",monospace;margin-top:6px}
.s3 .rule{width:46%;height:2px;background:#13293d;margin:7px auto 12px}
.s3 .photo{width:54%;aspect-ratio:3/4;margin:0 auto;background:linear-gradient(#dbe8f0,#eef4f8);border-radius:3px;position:relative}
.s3 .photo::after{content:"";position:absolute;left:26%;right:26%;top:20%;aspect-ratio:1;border-radius:50%;background:#9db3c4;box-shadow:0 34px 0 12px #9db3c4}
.s3 .nm{font:700 10px "Bricolage Grotesque",sans-serif;margin-top:9px}
.badge24{position:absolute;right:-6px;bottom:-12px;z-index:4;width:88px;height:88px;border-radius:50%;background:var(--gold);color:#13293d;display:grid;place-items:center;text-align:center;font:800 12px/1.1 "Bricolage Grotesque","Cairo",sans-serif;border:3px solid var(--bg)}
.badge24 b{display:block;font-size:28px;line-height:1}

section.s{padding-block:64px}
.h2{font-size:clamp(1.7rem,3.6vw,2.5rem)}
.sub{color:var(--muted);margin-top:10px;max-width:62ch}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.card .tg{display:inline-block;background:var(--soft);color:var(--accent);font:800 .8rem "Manrope",sans-serif;padding:3px 11px;border-radius:999px;margin-bottom:12px;direction:ltr}
.card h3{font-size:1.25rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.97rem}

.ink{background:var(--ink);color:var(--ink-fg)}
.ink .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding-block:64px;align-items:start}
.ink p.sub{color:var(--ink-muted)}
.ink .h2 em{color:var(--gold)}
.checks{display:grid;gap:10px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:14px 16px;border:1px solid rgba(255,255,255,.16);border-radius:12px}
.chk .t{font-weight:700}
.chk small{grid-column:2;color:var(--ink-muted);font-size:.9rem}
.chk .x{color:#ff9aa0;font-weight:800}
.chk .v{color:#6ee7b0;font-weight:800}
.chk.ok{border-color:#6ee7b0}

.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px;direction:ltr}
.sample{text-align:center;font-weight:700;font-size:.92rem}
.page{background:#fff;border:1px solid var(--line);border-radius:6px;aspect-ratio:3/4;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(19,41,61,.12);margin-bottom:10px;color:#13293d;padding:12px}
.page::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--gold)}
.page .hd{font:800 14px/1 "Bricolage Grotesque",sans-serif;text-align:center;margin-top:6px}
.page .ph{width:46%;aspect-ratio:3/4;margin:10px auto;background:#dbe8f0;border-radius:3px}
.page.cv .side{position:absolute;inset:0 auto 0 0;width:32%;background:#12456b}
.page.cv .col{position:absolute;left:38%;right:8%;top:12%}
.page .big{font:800 20px/1.1 "Bricolage Grotesque",sans-serif;text-align:center;margin-top:46%;color:#12456b}

.rev .q{font-size:1rem;margin-bottom:14px;line-height:1.8}
.rev .who{font-weight:700;color:var(--accent);font-size:.9rem}
.rev .q::before{content:"\201C";font:800 2.2rem/0 "Bricolage Grotesque",sans-serif;color:var(--gold);display:block;height:14px}

.steps{list-style:none;padding:0;margin:32px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.steps li::before{content:counter(st);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-fg);font:800 1rem "Bricolage Grotesque",sans-serif;margin-bottom:12px}
.steps h3{font-size:1.1rem;margin-bottom:4px}
.steps p{color:var(--muted);font-size:.94rem}

.pricebox{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:34px;background:var(--surface)}
.plist{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;font-weight:700}
.plist li::before{content:"\2713";color:var(--accent);font-weight:800;margin-inline-end:10px}
.pcard{background:var(--brand);color:var(--brand-fg);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:4px;justify-items:center}
.pcard .amt{font:800 4.6rem/1 "Bricolage Grotesque",sans-serif;direction:ltr}
.pcard .unit{font-weight:700;margin-bottom:12px;opacity:.9}

/* order form */
.formwrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;max-width:820px;margin-top:28px}
.prog{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.95rem;margin-bottom:10px;gap:10px}
.bar5{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar5 i{display:block;height:100%;width:20%;background:var(--accent);border-radius:999px;transition:width .25s}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:18px 0;font-size:.93rem;color:var(--muted)}
.fs{display:none;gap:16px}
.fs.on{display:grid}
.fs h3{font-size:1.2rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lb{font-weight:700;font-size:.92rem}
.fld label span.r{color:#c0392b}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=month],input[type=date],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7em .9em;min-width:0}
textarea{min-height:84px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.45em 1em;cursor:pointer;font-weight:600}
.opt input{accent-color:var(--accent)}
.entry{border:1px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.entry .eh{font-weight:800;color:var(--accent);font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn[disabled]{opacity:.5;cursor:default}
.err{color:#c0392b;font-weight:700;font-size:.9rem;min-height:1.2em;margin-top:10px}
.addbtn{justify-self:start;background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;padding:4px 0}
.done{text-align:center;display:none;padding:10px 0}
.done.on{display:block}
.done h3{margin-bottom:8px}
.prev{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.88rem;max-height:240px;overflow:auto;margin:16px 0}

.faq{display:grid;gap:10px;margin-top:26px;max-width:820px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px}
summary{cursor:pointer;padding:15px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1;font-weight:800}
details[open] summary::after{content:"\2212"}
details p{color:var(--muted);padding-bottom:12px}
details a{display:inline-block;margin-bottom:16px;color:var(--wa);font-weight:800}

.final{background:var(--brand);color:var(--brand-fg);padding:46px 24px;text-align:center;border-radius:20px;margin-block:8px 64px}
.final h2{font-size:clamp(1.7rem,3.8vw,2.6rem)}
.final p{margin:12px auto 0;max-width:52ch;opacity:.92}
.final .cta-row{justify-content:center}
.final .btn-main{background:#fff;color:#12456b}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:800}
.soc{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:16px;font-weight:700}
.soc a{color:inherit;text-underline-offset:3px}
footer{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:.88rem}
footer .wrap{display:grid;gap:12px}
.disc{max-width:80ch}
.sticky{display:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:34px;padding-block:34px 44px}
  .ink .wrap{grid-template-columns:1fr;gap:28px;padding-block:44px}
  .three{grid-template-columns:1fr}
  .samples{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .pricebox{grid-template-columns:1fr;padding:22px}
  .row{grid-template-columns:1fr}
  .formwrap{padding:20px}
  section.s{padding-block:44px}
  .sticky{display:flex;position:fixed;z-index:35;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));justify-content:center;align-items:center;gap:.6em;background:var(--brand);color:var(--brand-fg);font-weight:800;padding:.95em 1em;border-radius:12px;text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.28)}
  footer{padding-bottom:90px}
}
@media (max-width:480px){.bar .btn span{display:none}.bar .btn{padding:.55em .8em}.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.pill{transition:filter .15s,transform .15s}.btn:hover{transform:translateY(-1px)}}

.leadform{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 44px rgba(19,41,61,.14)}
.lf-h{font-size:1.5rem;margin-bottom:4px}
.lf-p{color:var(--muted);font-size:.95rem;margin-bottom:16px}
.lf-s{color:var(--muted);font-size:.82rem;margin-top:10px;text-align:center}
.leadform form{display:grid;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld label,.fld .lb{font-weight:700;font-size:.9rem}
.r{color:#c0392b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.65em .85em;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.4em 1em;cursor:pointer;font-weight:700}
.opt input{accent-color:var(--accent)}
.err{color:#c0392b;font-weight:700;font-size:.9rem;min-height:1.1em}
.btn-big{width:100%;padding:1em 1.2em;font-size:1.05rem}
button.btn{font-family:inherit}
.done{display:none;text-align:center}
.done.on{display:block}
.prev{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.86rem;margin:14px 0;overflow:auto;max-height:220px}
input:focus-visible,select:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.soc{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.soc a{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);padding:.6em 1.1em;border-radius:12px;text-decoration:none;font-weight:700}
.soc a:hover{background:rgba(255,255,255,.24)}
.soc svg{width:22px;height:22px;fill:currentColor}
.float{position:fixed;z-index:35;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:.6em;background:var(--wa);color:var(--wa-fg);font-weight:800;padding:.9em 1.3em;border-radius:999px;text-decoration:none;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.float svg{width:1.3em;height:1.3em;fill:currentColor}
@media (prefers-reduced-motion:no-preference){
  .float{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 12px 28px rgba(0,0,0,.3),0 0 0 0 rgba(27,158,80,.5)}50%{transform:scale(1.04);box-shadow:0 12px 28px rgba(0,0,0,.3),0 0 0 14px rgba(27,158,80,0)}}
}
@media (max-width:860px){.row{grid-template-columns:1fr}.float{inset-inline:max(12px,env(safe-area-inset-left,0px));justify-content:center}.leadform{padding:20px}}

.gal{display:grid;gap:16px;margin-top:28px}
.gal2{grid-template-columns:repeat(2,1fr);max-width:760px}
.gal4{grid-template-columns:repeat(4,1fr)}
.shot{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;cursor:zoom-in;overflow:hidden;box-shadow:0 8px 22px rgba(19,41,61,.1)}
.shot img{display:block;width:100%;height:auto;border-radius:9px}
.gal4 .shot img{aspect-ratio:3/5;object-fit:cover;object-position:top}
.gh{font-size:1.15rem;margin-top:36px}
.lbox{position:fixed;inset:0;z-index:60;background:rgba(5,12,20,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lbox[hidden]{display:none}
.lbox img{max-width:min(100%,900px);max-height:100%;border-radius:8px}

var lang = "ar";
try{ var sv = localStorage.getItem("procv-lang"); if(sv==="ar"||sv==="fr") lang = sv; }catch(e){}
function $(id){return document.getElementById(id)}
function v(id){return ($(id).value||"").trim()}
function waHref(text){return "https://wa.me/"+PHONE+"?text="+encodeURIComponent(text)}
function isForm(){var t=document.querySelector('input[name=f_type]:checked');return !!t&&t.value==="Ausbildung"}
function updJob(){var d=T[lang],f=isForm(),t=document.querySelector('input[name=f_type]:checked');
  $("jobLbl").textContent=t?(f?d.jobFormLbl:d.jobPosteLbl):d.fJob;
  $("f_job").placeholder=f?d.jobPh2:d.jobPh1;}
function buildMessage(){
  var t=document.querySelector('input[name=f_type]:checked'), f=isForm();
  var L=[];
  L.push("\u{1F1E9}\u{1F1EA} *DEMANDE DE DOSSIER BEWERBUNG*","\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501","",
    "\u{1F464} *Candidat(e)*",
    "\u2022 Prénom : "+v("f_first"),"\u2022 Nom : "+v("f_last"),"\u2022 Ville : "+v("f_city"),"\u2022 E-mail : "+v("f_mail"),"",
    "\u{1F3AF} *Projet*",
    "\u2022 Je cherche : "+(t?(f?"Ausbildung (formation)":"Emploi (Arbeit)"):""),
    "\u2022 "+(f?"Formation visée : ":"Poste visé : ")+v("f_job"),
    "\u2022 Niveau d'allemand : "+v("f_de"));
  if($("f_nocv").checked){
    var ex=[["Date de naissance","n_birth"],["Nationalité","n_nat"],["Études et diplômes","n_edu"],["Expériences","n_exp"],["Langues","n_lang"],["Permis","n_perm"],["Compétences","n_skills"]].filter(function(p){return v(p[1])});
    if(ex.length){L.push("","\u{1F4DD} *Infos pour mon CV (je n'ai pas de CV)*"); ex.forEach(function(p){L.push("\u2022 "+p[0]+" : "+v(p[1]).replace(/\n+/g," / "))});}
  }
  L.push("","\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501","\u{1F4F7} Je vous envoie ma photo juste après.","\u{1F64F} Merci !");
  return L.join("\n");
}
function apply(){
  var d=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(function(el){var k=el.getAttribute("data-t"); if(d[k]!==undefined) el.textContent=d[k]});
  document.querySelectorAll("[data-t-html]").forEach(function(el){el.innerHTML=d[el.getAttribute("data-t-html")]});
  $("lang").textContent = lang==="ar"?"Français":"العربية";
  document.querySelectorAll("[data-t-ph]").forEach(function(el){var k=el.getAttribute("data-t-ph"); if(d[k]!==undefined) el.placeholder=d[k]});
  updJob();
  $("amt").textContent=PRICE;
  var box=$("revList"); box.textContent="";
  REVIEWS.forEach(function(r){
    var c=document.createElement("div"); c.className="card rev";
    var q=document.createElement("p"); q.className="q"; q.textContent=lang==="ar"?r.ar:r.fr;
    var w=document.createElement("p"); w.className="who"; w.textContent=r.name+" · Instagram";
    c.appendChild(q); c.appendChild(w); box.appendChild(c);
  });
  document.querySelectorAll("a.wa").forEach(function(a){
    var det=a.closest("details");
    a.href=waHref(det? d.waq+det.querySelector("summary").textContent : d.wa);
    a.target="_blank"; a.rel="noopener";
  });
}
$("lang").addEventListener("click",function(){lang=lang==="ar"?"fr":"ar"; try{localStorage.setItem("procv-lang",lang)}catch(e){} apply()});
function mark(el,bad){ if(el) el.classList.toggle("bad",!!bad); }
$("order").addEventListener("submit",function(e){
  e.preventDefault();
  var checks=[["f_first",v("f_first")],["f_last",v("f_last")],["f_de",v("f_de")],["f_city",v("f_city")],["f_mail",v("f_mail").indexOf("@")>0],["f_job",v("f_job")]];
  var firstBad=null;
  checks.forEach(function(c){ var bad=!c[1]; mark($(c[0]),bad); if(bad&&!firstBad) firstBad=$(c[0]); });
  var typ=document.querySelector('input[name=f_type]:checked');
  document.querySelectorAll(".opts .opt").forEach(function(o){mark(o,!typ)});
  if(!typ&&!firstBad) firstBad=document.querySelector('input[name=f_type]');
  if(firstBad){ $("err").textContent=T[lang].errReq; try{firstBad.focus()}catch(x){} return; }
  $("err").textContent="";
  try{ if(window.fbq) fbq("track","Lead",{content_name:v("f_job")}); }catch(x){}
  var msg=buildMessage(), href=waHref(msg);
  $("prevMsg").textContent=msg; $("waLink").href=href;
  $("order").style.display="none"; $("done").classList.add("on");
  try{ window.open(href,"_blank","noopener"); }catch(x){}
});
document.querySelectorAll(".leadform input,.leadform select").forEach(function(el){
  el.addEventListener("input",function(){ el.classList.remove("bad"); if(el.name==="f_type") document.querySelectorAll(".opts .opt").forEach(function(o){o.classList.remove("bad")}); });
  el.addEventListener("change",function(){ el.classList.remove("bad"); if(el.name==="f_type") document.querySelectorAll(".opts .opt").forEach(function(o){o.classList.remove("bad")}); });
});
document.querySelectorAll("[data-zoom]").forEach(function(b){
  b.addEventListener("click",function(){ var im=$(b.getAttribute("data-zoom")); $("lbimg").src=im.src; $("lbimg").alt=im.alt; $("lbox").hidden=false; });
});
$("lbox").addEventListener("click",function(){ $("lbox").hidden=true; });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") $("lbox").hidden=true; });
$("copyMsg").addEventListener("click",function(){
  var b=this, m=$("prevMsg").textContent;
  try{ navigator.clipboard.writeText(m).then(function(){b.textContent=T[lang].copied; setTimeout(function(){b.textContent=T[lang].copy},1500)},function(){var r=document.createRange(); r.selectNodeContents($("prevMsg")); var s=getSelection(); s.removeAllRanges(); s.addRange(r)}) }catch(e){}
});
document.querySelectorAll("input[name=f_type]").forEach(function(r){r.addEventListener("change",updJob)});
$("f_nocv").addEventListener("change",function(){$("nocvBox").hidden=!this.checked});
apply();
</script>
